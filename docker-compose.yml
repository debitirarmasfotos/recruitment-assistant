# Recruitment Assistant MVP - single-service compose stack.
# Runtime target: crewai (AAMAD_TARGET_RUNTIME=crewai).
#
# Secrets come from .env at run time (env_file below); no secret values live in
# this file. Copy .env.example to .env and set OPENAI_API_KEY before running.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: recruitment-assistant:mvp
    # Publish on host loopback only (127.0.0.1). This preserves the security.md
    # H1 mitigation: the unauthenticated, paid-LLM endpoint stays off untrusted
    # networks. Change to "8000:8000" only after adding auth + rate limiting.
    ports:
      - "127.0.0.1:8000:8000"
    # Runtime secrets and config (OPENAI_API_KEY, OPENAI_MODEL, etc.). This file
    # is gitignored and must never be committed.
    env_file:
      - .env
    restart: unless-stopped
    # Liveness via the app's own health endpoint (SAD section 5).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
